<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>TapTap 制造 · 会话归档</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", system-ui, sans-serif; margin: 0;
    background: #f6f8fb; color: #1f2937;
    display: flex; flex-direction: column;
  }

  /* ---------- 顶栏 ---------- */
  header {
    background: #111827; color: #fff; padding: 14px 22px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .3px; }
  header .sub { font-size: 12px; color: #9ca3af; }
  .grow { flex: 1; }
  .search {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16);
    border-radius: 8px; padding: 6px 10px; min-width: 260px;
  }
  .search input {
    background: none; border: 0; outline: none; color: #fff;
    font-size: 13px; font-family: inherit; width: 100%;
  }
  .search input::placeholder { color: #9ca3af; }
  .btn {
    background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.18);
    border-radius: 8px; padding: 7px 12px; font-size: 12px; font-family: inherit;
    cursor: pointer; transition: background .15s;
  }
  .btn:hover { background: rgba(255,255,255,.22); }
  .btn.primary { background: #2563eb; border-color: #2563eb; }
  .btn.primary:hover { background: #1d4ed8; }

  /* ---------- 统计条 ---------- */
  .stats {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px; padding: 14px 22px 0;
  }
  .stat {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
    padding: 10px 14px;
  }
  .stat b { display: block; font-size: 19px; color: #1d4ed8; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: #6b7280; }
  @media (max-width: 620px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  /* ---------- 主体 ---------- */
  .layout {
    flex: 1; display: grid; grid-template-columns: 300px 1fr;
    gap: 14px; padding: 14px 22px 22px; min-height: 0;
  }
  aside, section.reader {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    min-height: 0; display: flex; flex-direction: column; overflow: hidden;
  }
  aside { overflow-y: auto; padding: 8px; }
  .reader { overflow-y: auto; }

  /* 项目 */
  .proj { margin-bottom: 6px; }
  .proj-h {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 9px 10px; border-radius: 8px; background: #f8fafc;
    font-size: 13px; font-weight: 700; color: #1f2937; user-select: none;
  }
  .proj-h:hover { background: #eef2f7; }
  .proj-h .caret { font-size: 10px; color: #9ca3af; width: 8px; }
  .proj-h .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-h .cnt { font-size: 11px; font-weight: 400; color: #6b7280; }
  .proj.open .caret { transform: rotate(90deg); }
  .proj-body { display: none; padding: 2px 0 4px 6px; }
  .proj.open .proj-body { display: block; }

  .chat-item {
    padding: 8px 10px; border-radius: 8px; cursor: pointer; margin: 2px 0;
    border-left: 3px solid transparent;
  }
  .chat-item:hover { background: #f8fafc; }
  .chat-item.on { background: #eff6ff; border-left-color: #2563eb; }
  .ci-t {
    font-size: 12.5px; color: #1f2937; line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .chat-item.on .ci-t { color: #1d4ed8; font-weight: 600; }
  .ci-m { font-size: 10.5px; color: #9aa3b2; margin-top: 3px; }

  /* 阅读区 */
  .rd-head {
    position: sticky; top: 0; background: #fff; z-index: 2;
    padding: 16px 20px 12px; border-bottom: 1px solid #f0f2f5;
  }
  .rd-head h2 { margin: 0 0 6px; font-size: 15px; line-height: 1.45; }
  .rd-meta { font-size: 11.5px; color: #6b7280; display: flex; gap: 12px; flex-wrap: wrap; }
  .rd-meta b { color: #374151; font-weight: 600; }
  .rd-actions { margin-top: 10px; display: flex; gap: 8px; }
  .btn-mini {
    background: #f1f5f9; color: #374151; border: 1px solid #e2e8f0;
    border-radius: 7px; padding: 5px 10px; font-size: 11.5px; font-family: inherit; cursor: pointer;
  }
  .btn-mini:hover { background: #e8eef6; }
  #btn-mdmode { min-width: 118px; }

  .turns { padding: 6px 20px 24px; }
  .turn { padding: 14px 0; border-bottom: 1px dashed #eef0f3; }
  .turn:last-child { border-bottom: 0; }
  .turn-h { font-size: 11px; color: #9aa3b2; margin-bottom: 8px; display: flex; gap: 10px; }
  .turn-h .idx { color: #64748b; font-weight: 700; }
  .blk { display: flex; gap: 10px; margin-bottom: 8px; }
  .who {
    flex: 0 0 auto; width: 34px; text-align: center; font-size: 11px; line-height: 20px;
    border-radius: 5px; height: 20px;
  }
  .blk.u .who { background: #dbeafe; color: #1d4ed8; }
  .blk.a .who { background: #dcfce7; color: #15803d; }
  .txt {
    flex: 1; font-size: 13px; line-height: 1.75; color: #1f2937;
    white-space: pre-wrap; word-break: break-word; min-width: 0;
  }
  .txt.clip { max-height: 168px; overflow: hidden; position: relative; }
  .txt.clip::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
    background: linear-gradient(rgba(255,255,255,0), #fff);
  }

  /* ---------- Markdown 正文 ---------- */
  .txt.md { white-space: normal; }
  .txt.md > *:first-child { margin-top: 0; }
  .txt.md > *:last-child { margin-bottom: 0; }
  .txt.md p { margin: 0 0 9px; }
  .txt.md h4, .txt.md h5, .txt.md h6 { margin: 13px 0 6px; line-height: 1.4; color: #111827; }
  .txt.md h4 { font-size: 14.5px; }
  .txt.md h5 { font-size: 13.5px; }
  .txt.md h6 { font-size: 13px; color: #374151; }
  .txt.md ul, .txt.md ol { margin: 6px 0 10px; padding-left: 22px; }
  .txt.md li { margin: 3px 0; }
  .txt.md li::marker { color: #6b7280; }
  .txt.md li > ul, .txt.md li > ol { margin: 3px 0; }
  .txt.md strong { color: #111827; }
  .txt.md a { color: #2563eb; text-decoration: none; border-bottom: 1px solid rgba(37,99,235,.28); }
  .txt.md a:hover { border-bottom-color: #2563eb; }
  .txt.md code {
    background: #f1f5f9; border: 1px solid #e6eaf0; border-radius: 4px;
    padding: 1px 4px; font-size: 12px;
    font-family: Consolas, "SF Mono", Menlo, monospace;
  }
  .txt.md pre.code {
    position: relative; margin: 8px 0 12px; padding: 10px 12px;
    background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px;
    overflow-x: auto; font-size: 12px; line-height: 1.65; white-space: pre;
    tab-size: 2; font-family: Consolas, "SF Mono", Menlo, monospace;
  }
  .txt.md pre.code code { background: none; border: 0; padding: 0; font-size: inherit; }
  .txt.md pre.code::after {
    content: attr(data-lang); position: absolute; right: 9px; top: 6px;
    font-size: 10px; color: #b6bdc9; letter-spacing: .4px;
  }
  .txt.md blockquote {
    margin: 8px 0; padding: 5px 0 5px 12px; border-left: 3px solid #dbe3ec;
    color: #4b5563; background: #fafbfd;
  }
  .txt.md blockquote p:last-child { margin-bottom: 0; }
  .txt.md hr { border: 0; border-top: 1px solid #eef0f3; margin: 12px 0; }
  .txt.md table.md-t {
    border-collapse: collapse; margin: 8px 0 12px; font-size: 12px;
    display: block; overflow-x: auto; max-width: 100%;
  }
  .txt.md table.md-t th, .txt.md table.md-t td {
    border: 1px solid #e5e7eb; padding: 5px 9px; text-align: left; vertical-align: top;
  }
  .txt.md table.md-t th { background: #f3f6fa; font-weight: 600; white-space: nowrap; }
  .txt.md .plain { white-space: pre-wrap; }
  .muted { color: #9aa3b2; }
  .sentinel { text-align: center; font-size: 11.5px; color: #9aa3b2; padding: 10px 0 20px; }
  .sentinel.done { color: #b6bdc9; }
  .more {
    margin: 4px 0 0 44px; font-size: 11.5px; color: #2563eb; cursor: pointer;
    background: none; border: 0; font-family: inherit; padding: 0;
  }
  .more:hover { text-decoration: underline; }
  .empty { padding: 60px 20px; text-align: center; color: #9aa3b2; font-size: 13px; }
  .hit { background: #fef08a; }
  .warn {
    margin: 0 22px 0; padding: 9px 12px; border-radius: 8px;
    background: #fffbeb; border: 1px solid #fde68a; color: #92400e; font-size: 12px; display: none;
  }
  .warn.on { display: block; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    aside { max-height: 260px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>会话归档</h1>
    <div class="sub" id="hdr-sub">按项目 / 会话浏览全部对话 · 数据只在本机</div>
  </div>
  <div class="grow"></div>
  <div class="search">
    <input type="text" id="q" placeholder="搜索会话标题或对话内容" autocomplete="off">
  </div>
  <button class="btn" id="btn-refresh">刷新</button>
  <button class="btn primary" id="btn-md">导出 Markdown</button>
</header>

<div class="stats">
  <div class="stat"><b id="s-proj">–</b><span>项目</span></div>
  <div class="stat"><b id="s-chat">–</b><span>会话</span></div>
  <div class="stat"><b id="s-turn">–</b><span>对话轮次</span></div>
  <div class="stat"><b id="s-char">–</b><span>输出字数</span></div>
  <div class="stat"><b id="s-credit">–</b><span>记录积分</span></div>
</div>

<div class="warn" id="warn"></div>

<div class="layout">
  <aside id="tree"><div class="empty">读取中…</div></aside>
  <section class="reader" id="reader">
    <div class="empty">从左边选一个会话</div>
  </section>
</div>

<script src="archive.js"></script>
</body>
</html>
